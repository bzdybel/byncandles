krotkiOpis: "Świeca sojowa w ryflowanym słoiczku, z suszonymi kwiatami lawendy. Intensywny, otulający zapach lawendy i drzewa sandałowego."
opis: |-
  Świeczka w eleganckim, ryflowanym słoiczku - minimalistyczna, a jednocześnie wyjątkowa.

  Lawenda i drzewo sandałowe z dodatkiem suszonych kwiatów lawendy to intensywny, otulający zapach, który wypełnia przestrzeń i sprzyja relaksowi. Wykonana z naturalnego wosku sojowego.

  Słoiczek czarny albo biały - kolor wybierasz, wpisując go w uwagach do zamówienia.
