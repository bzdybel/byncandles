    alt: "Trzy świece w kształcie alpak - fioletowo-szara, pomarańczowa i brzoskwiniowa - na tle drewnianego płotu"
  - zdjecie: ../../assets/produkty/alpaka-zapakowana.webp
    alt: "Świeca-alpaka zapakowana w przezroczysty celofan ze sznurkiem, trzymana w dłoni"
