krotkiOpis: "Duża, różowa świeca w kształcie szkockiej krowy Highland z długą, falowaną grzywką i rogami. Dekoracja z charakterem."
opis: |-
  Szkocka krowa w wersji pink - z długą, falowaną grzywką, rogami i kudłatą sierścią odwzorowaną w każdym detalu. Większa od naszych małych krówek, więc sama w sobie jest dekoracją.

  Ręcznie odlewana świeca, która nie stoi tylko na półce - staje się tematem rozmów.
