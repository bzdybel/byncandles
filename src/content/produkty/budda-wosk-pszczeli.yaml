krotkiOpis: "Świeca w kształcie medytującego Buddy w 100% z naturalnego wosku pszczelego z lokalnej pasieki. Miodowy kolor i delikatny zapach."
opis: |-
  Ta świeca powstała w 100% z naturalnego wosku pszczelego, pozyskiwanego prosto z lokalnej pasieki. Bez zbędnych dodatków - tylko naturalny wosk, piękny kolor i charakterystyczny, delikatny, miodowy zapach.

  Spokój zamknięty w formie - dla wnętrz, w których liczy się równowaga i harmonia.
