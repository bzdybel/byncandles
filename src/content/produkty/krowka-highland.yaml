krotkiOpis: "Mała świeca w kształcie kudłatej szkockiej krówki Highland. Ręcznie odlewana, w pudrowym różu, bieli, brązie lub szarości."
opis: |-
  Małe szkockie krówki, które aż proszą się o miejsce w Twoim wnętrzu. Ręcznie wykonane świece w kształcie uroczych, kudłatych krów Highland - inspirowanych charakterystycznymi szkockimi krowami o długiej, miękkiej sierści.

  Dostępne kolory: pudrowy róż, biel, brąz i szarość. Kolor wybierasz, wpisując go w uwagach do zamówienia.
